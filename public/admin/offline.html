<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1420">
  <title>Safe View Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 20px;background:linear-gradient(160deg,#0a0f18,#14233a);color:#eef1f5;font:500 16px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
    main{max-width:340px}
    img{width:190px;display:block;margin:0 auto 26px}
    h1{font:600 30px/1.15 Georgia,'Times New Roman',serif;margin:0 0 8px}
    p{margin:0 0 24px;color:#a6b0be}
    button{width:100%;min-height:48px;border:0;border-radius:10px;background:linear-gradient(135deg,#ecd492,#c9a24b);color:#17120a;font:700 15px inherit;font-family:inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/img/word-t.png" alt="Safe View Glass Solutions">
    <h1>You're offline</h1>
    <p>Safe View needs the internet to show your bills and accounts. Check your connection and try again.</p>
    <button type="button" onclick="location.href='/admin/'">Try Again</button>
  </main>
</body>
</html>
