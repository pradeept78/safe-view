# Only Caddy is reachable from outside (80, 443). The app has no published port.
x-logging: &limited-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    container_name: safe-view-app
    restart: unless-stopped
    logging: *limited-logs
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    volumes:
      - ${DATA_DIR:-/var/lib/safe-view}:/data
    networks:
      - safe-view-net

  caddy:
    image: caddy:2.8-alpine
    container_name: safe-view-caddy
    restart: unless-stopped
    logging: *limited-logs
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - safe-view-net

networks:
  safe-view-net:

volumes:
  caddy_data:
  caddy_config:
